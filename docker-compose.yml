services:
  app:
    build: .
    container_name: bhims_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: db
      DB_NAME: bhims
      DB_USER: bhims_user
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: bhims_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}
      MYSQL_DATABASE: bhims
      MYSQL_USER: bhims_user
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      - bhims_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bhims_db_data:
