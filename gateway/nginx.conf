events {}

http {
  server {
    listen 80;

    location /auth/          { proxy_pass http://auth-service:4001; }
    location /patients        { proxy_pass http://patient-service:4002; }
    location /households      { proxy_pass http://patient-service:4002; }
    location /visits          { proxy_pass http://consultation-service:4003; }
    location /prenatal-checkups { proxy_pass http://mch-service:4004; }
    location /immunizations   { proxy_pass http://mch-service:4004; }
    location /growth-records  { proxy_pass http://mch-service:4004; }
    location /appointments    { proxy_pass http://appointment-service:4005; }
    location /queue           { proxy_pass http://appointment-service:4005; }
    location /stock-items     { proxy_pass http://inventory-service:4006; }
    location /stock-transactions { proxy_pass http://inventory-service:4006; }
    location /referrals       { proxy_pass http://referral-service:4007; }
    location /reports         { proxy_pass http://reporting-service:4008; }
    location /audit-events    { proxy_pass http://audit-service:4009; }
  }
}
